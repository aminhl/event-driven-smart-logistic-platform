services:
  postgres:
    container_name: edslp_pg
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DATA: /var/lib/postgresql/data
    volumes:
      - edslp:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - edslp
    restart: unless-stopped


  mail-dev:
    container_name: edslp_mail_dev
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"

networks:
  edslp:
    name: edslp
    driver: bridge

volumes:
  edslp:
    name: edslp_pg_data
    driver: local
  pgadmin:
    name: pgadmin_data
    driver: local